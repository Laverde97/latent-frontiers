<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-label="Esquema ilustrativo de PCA: cada punto es una muestra resumida en dos componentes">
  <rect width="960" height="470" fill="#FFFFFF" />
  <line x1="90" y1="380" x2="560" y2="380" stroke="#1A1A1A" stroke-width="2" />
  <line x1="90" y1="380" x2="90" y2="50" stroke="#1A1A1A" stroke-width="2" />
  <text x="325" y="420" font-size="18" fill="#1A1A1A" font-weight="bold" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">PC1</text>
  <text x="55" y="215" font-size="18" fill="#1A1A1A" font-weight="bold" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">PC2</text>
  <circle cx="150" cy="290" r="12" fill="#4FA3D1" />
  <circle cx="175" cy="320" r="12" fill="#4FA3D1" />
  <circle cx="200" cy="280" r="12" fill="#4FA3D1" />
  <circle cx="165" cy="255" r="12" fill="#4FA3D1" />
  <circle cx="400" cy="140" r="12" fill="#1D4E89" />
  <circle cx="440" cy="170" r="12" fill="#1D4E89" />
  <circle cx="420" cy="110" r="12" fill="#1D4E89" />
  <circle cx="470" cy="135" r="12" fill="#1D4E89" />
  <circle cx="380" cy="210" r="12" fill="#4C4A7D" />
  <circle cx="430" cy="235" r="12" fill="#4C4A7D" />
  <circle cx="470" cy="205" r="12" fill="#4C4A7D" />
  <circle cx="500" cy="250" r="12" fill="#4C4A7D" />
  <circle cx="620" cy="90" r="10" fill="#4FA3D1" />
  <text x="642" y="96" font-size="17" fill="#1A1A1A" font-weight="normal" text-anchor="start" font-family="Helvetica, Arial, sans-serif">p16− / HPV−  (hiperplasia)</text>
  <circle cx="620" cy="130" r="10" fill="#1D4E89" />
  <text x="642" y="136" font-size="17" fill="#1A1A1A" font-weight="normal" text-anchor="start" font-family="Helvetica, Arial, sans-serif">p16+ / HPV16+</text>
  <circle cx="620" cy="170" r="10" fill="#4C4A7D" />
  <text x="642" y="176" font-size="17" fill="#1A1A1A" font-weight="normal" text-anchor="start" font-family="Helvetica, Arial, sans-serif">p16+ / HPV16−</text>
  <text x="620" y="250" font-size="17" fill="#1A1A1A" font-weight="normal" text-anchor="start" font-family="Helvetica, Arial, sans-serif">PCA resume miles de regiones</text>
  <text x="620" y="278" font-size="17" fill="#1A1A1A" font-weight="normal" text-anchor="start" font-family="Helvetica, Arial, sans-serif">en pocos ejes de máxima varianza.</text>
  <text x="620" y="306" font-size="17" fill="#1A1A1A" font-weight="normal" text-anchor="start" font-family="Helvetica, Arial, sans-serif" />
  <text x="620" y="334" font-size="17" fill="#1A1A1A" font-weight="bold" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Separación visual ≠ clasificador.</text>
  <text x="620" y="362" font-size="17" fill="#1A1A1A" font-weight="bold" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Con 12 muestras es exploratoria.</text>
  <text x="480" y="455" font-size="14" fill="#6B7280" font-weight="normal" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Esquema ilustrativo, no reproduce los datos del artículo</text>
</svg>