<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 492" width="720" height="492" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Reported validation</title><desc id="d">Internal validation only: T1 1/11, T2 23/43; Internal and external: T1 2/11, T2 12/43; External validation only: T1 4/11, T2 3/43; No validation reported: T1 4/11, T2 5/43</desc><rect width="720" height="492" fill="#FFFFFF"/><text x="20" y="28" font-size="17" fill="#1A1A1A" text-anchor="start" font-weight="600" >Reported validation per tool</text><text x="20" y="50.0" font-size="12.5" fill="#6B7280" text-anchor="start" font-weight="400" >Mutually exclusive groups that separate the overlap: overall, 38 tools with internal and 21 with</text><text x="20" y="66.9" font-size="12.5" fill="#6B7280" text-anchor="start" font-weight="400" >external validation (14 with both).</text><text x="20" y="108" font-size="14" fill="#1A1A1A" text-anchor="start" font-weight="600" >Table 1 · treatment outcomes (n = 11)</text><text x="20" y="141" font-size="13" fill="#33333A" text-anchor="start" font-weight="400" >Internal validation only</text><line x1="270" y1="123" x2="270" y2="149" stroke="#E2E8F0"/><path d="M270,126 H282.0 Q286.0,126 286.0,130 V142 Q286.0,146 282.0,146 H270 Z" fill="#1D4E89"><title>Internal validation only: 1/11</title></path><text x="292.0" y="141" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="600" >1/11</text><text x="20" y="173" font-size="13" fill="#33333A" text-anchor="start" font-weight="400" >Internal and external</text><line x1="270" y1="155" x2="270" y2="181" stroke="#E2E8F0"/><path d="M270,158 H298.0 Q302.0,158 302.0,162 V174 Q302.0,178 298.0,178 H270 Z" fill="#1D4E89"><title>Internal and external: 2/11</title></path><text x="308.0" y="173" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="600" >2/11</text><text x="20" y="205" font-size="13" fill="#33333A" text-anchor="s