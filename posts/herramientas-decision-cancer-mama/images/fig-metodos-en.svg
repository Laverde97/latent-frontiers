<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Reported methods</title><desc id="d">Cox / competing-risks regression: 32; Other regression (logistic, GLM, simple): 11; Machine learning or “AI” (as reported): 4; Tailored information (no predictive model): 3; Simulation (Markov) or Bayesian analysis: 2; t-tests, chi-square, fractional logit: 2</desc><rect width="720" height="380" fill="#FFFFFF"/><text x="20" y="28" font-size="17" fill="#1A1A1A" text-anchor="start" font-weight="600" >Reported methods used to estimate outcomes</text><text x="20" y="50.0" font-size="12.5" fill="#6B7280" text-anchor="start" font-weight="400" >Own grouping of the “Methods” column; groups are mutually exclusive and sum to 54.</text><text x="20" y="108" font-size="14" fill="#1A1A1A" text-anchor="start" font-weight="600" >All 54 tools</text><text x="20" y="141" font-size="13" fill="#33333A" text-anchor="start" font-weight="400" >Cox / competing-risks regression</text><line x1="340" y1="123" x2="340" y2="149" stroke="#E2E8F0"/><path d="M340,126 H531.5555555555555 Q535.5555555555555,126 535.5555555555555,130 V142 Q535.5555555555555,146 531.5555555555555,146 H340 Z" fill="#1D4E89"><title>Cox / competing-risks regression: 32/54</title></path><text x="541.5555555555555" y="141" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="600" >32/54</text><text x="20" y="173" font-size="13" fill="#33333A" text-anchor="start" font-weight="400" >Other regression (logistic, GLM, simple)</text><line x1="340" y1="155" x2="340" y2="181" stroke="#E2E8F0"/><path d="M340,158 H403.22222222222223 Q407.22222222222223,158 407.22222222222223,162 V174 Q407.22222222222223,178 403.22222222222223,178 H340 Z" fill="#1D4E89"><title>Other regression (logistic, GLM, simple): 11/54</title></path><text x="413.22222222222223" y="173" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="600" >11/54</text><text x="20" y="205" font-size="13" fill="#33333A" text-anchor="start" font-weight="400" >Machine learning or “AI” (as reported)</text><line x1="340" y1="187" x2="340" y2="213" stroke="#E2E8F0"/><path d="M340,190 H360.44444444444446 Q364.44444444444446,190 364.44444444444446,194 V206 Q364.44444444444446,210 360.44444444444446,210 H340 Z" fill="#1D4E89"><title>Machine learning or “AI” (as reported): 4/54</title></path><text x="370.44444444444446" y="205" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="600" >4/54</text><text x="20" y="237" font-size="13" fill="#33333A" text-anchor="start" font-weight="400" >Tailored information (no predictive model)</text><line x1="340" y1="219" x2="340" y2="245" stroke="#E2E8F0"/><path d="M340,222 H354.3333333333333 Q358.3333333333333,222 358.3333333333333,226 V238 Q358.3333333333333,242 354.3333333333333,242 H340 Z" fill="#1D4E89"><title>Tailored information (no predictive model): 3/54</title></path><text x="364.3333333333333" y="237" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="600" >3/54</text><text x="20" y="269" font-size="13" fill="#33333A" text-anchor="start" font-weight="400" >Simulation (Markov) or Bayesian analysis</text><line x1="340" y1="251" x2="340" y2="277" stroke="#E2E8F0"/><path d="M340,254 H348.22222222222223 Q352.22222222222223,254 352.22222222222223,258 V270 Q352.22222222222223,274 348.22222222222223,274 H340 Z" fill="#1D4E89"><title>Simulation (Markov) or Bayesian analysis: 2/54</title></path><text x="358.22222222222223" y="269" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="600" >2/54</text><text x="20" y="301" font-size="13" fill="#33333A" text-anchor="start" font-weight="400" >t-tests, chi-square, fractional logit</text><line x1="340" y1="283" x2="340" y2="309" stroke="#E2E8F0"/><path d="M340,286 H348.22222222222223 Q352.22222222222223,286 352.22222222222223,290 V302 Q352.22222222222223,306 348.22222222222223,306 H340 Z" fill="#1D4E89"><title>t-tests, chi-square, fractional logit: 2/54</title></path><text x="358.22222222222223" y="301" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="600" >2/54</text><text x="20" y="350.5" font-size="11.5" fill="#6B7280" text-anchor="start" font-weight="400" >Own elaboration based on Tables 1 and 2 of Wojcik et al. (2025), CC BY 4.0. The article itself does not use</text><text x="20" y="366.0" font-size="11.5" fill="#6B7280" text-anchor="start" font-weight="400" >this grouping.</text></svg>
