<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Reported methods</title><desc id="d">Cox / competing-risks regression: 32; Other regression (logistic, GLM, simple): 11; Machine learning or “AI” (as reported): 4; Tailored information (no predictive model): 3; Simulation (Markov) or Bayesian analysis: 2; t-tests, chi-square, fractional logit: 2</desc><rect width="720" height="380" fill="#FFFFFF"/><text x="20" y="28" font-size="17" fill="#1A1A1A" text-anchor="start" font-weight="600" >Reported methods used to estimate outcomes</text><text x="20" y="50.0" font-size="12.5" fill="#6B7280" text-anchor="start" font-weight="400" >Own grouping of the “Methods” column; groups are mutually exclusive and sum to 54.</text><text x="20" y="108" font-size="14" fill="#1A1A1A" text-anchor="start" font-weight="600" >All 54 tools</text><text x="20" y="141" font-size="13" fill="#33333A" text-anchor="start" font-weight="400" >Cox / competing-risks regression</text><line x1="270" y1="123" x2="270" y2="149" stroke="#E2E8F0"/><path d="M270,126 H503.03703703703707 Q507.03703703703707,126 507.03703703703707,130 V142 Q507.03703703703707,146 503.03703703703707,146 H270 Z" fill="#1D4E89"><title>Cox / competing-risks regression: 32/54</title></path><text x="513.0370370370371" y="141" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="600" >32/54</text><text x="20" y="173" font-size="13" fill="#33333A" text-anchor="start" font-weight="400" >Other regression (logistic, GLM, simple)</text><line x1="270" y1="155" x2="270" y2="181" stroke="#E2E8F0"/><path d="M270,158 H347.48148148148147 Q351.48148148148147,158 351.48148148148147,162 V174 Q351.48148148148147,178 347.48148148148147,178 H270 Z" fill="#1D4E89"><title>Other regression (logistic, GLM, simple): 11/54</title></path><text x="357.48148148148147" y="173" font-siz