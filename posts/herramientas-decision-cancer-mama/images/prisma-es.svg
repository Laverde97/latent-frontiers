<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Figura 1. Diagrama de flujo PRISMA de la selección de artículos</title><desc id="d">Registros identificados: 5.237 en bases de datos (PubMed 1.957, Embase 862, Cochrane 252, Web of Science 1.238, Scopus 838, PsycINFO 90) y 72 por búsqueda de citas. Se eliminaron 2.292 duplicados; se cribaron 3.017 registros y se excluyeron 2.646. Se buscaron y evaluaron 371 informes (0 no recuperados); se excluyeron 319 por las razones listadas. Se incluyeron 46 estudios más 8 estudios de validación.</desc><rect width="900" height="900" fill="#FFFFFF"/><rect x="120" y="16" width="700" height="38" rx="6" fill="#F4C542" stroke="#C99A10"/><text x="470" y="41" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="600" >Identificación de estudios mediante bases de datos y registros</text><rect x="16" y="70" width="40" height="250" rx="8" fill="#BBD3EA" stroke="#1D4E89"/><text x="36" y="195.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="600" transform="rotate(-90 36 195.0)" dominant-baseline="middle">Identificación</text><rect x="16" y="340" width="40" height="400" rx="8" fill="#BBD3EA" stroke="#1D4E89"/><text x="36" y="540.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="600" transform="rotate(-90 36 540.0)" dominant-baseline="middle">Cribado</text><rect x="16" y="760" width="40" height="120" rx="8" fill="#BBD3EA" stroke="#1D4E89"/><text x="36" y="820.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="600" transform="rotate(-90 36 820.0)" dominant-baseline="middle">Incluidos</text><rect x="80" y="70" width="390" height="250" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4" rx="4"/><text x="94" y="94" font-size="14" fill="#1A1A1A" text-anchor="start" font-weight="400" >Registros identificados en*:</text><