th="1.4" rx="4"/><text x="464" y="374" font-size="14" fill="#1A1A1A" text-anchor="start" font-weight="400" >Registros excluidos**</text><text x="464" y="394" font-size="14" fill="#1A1A1A" text-anchor="start" font-weight="400" >(n = 2.646)</text><line x1="380" y1="385" x2="439" y2="385" stroke="#1A1A1A" stroke-width="1.4"/><path d="M448,385 L438,380 L438,390 Z" fill="#1A1A1A"/><rect x="80" y="450" width="300" height="70" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4" rx="4"/><text x="94" y="474" font-size="14" fill="#1A1A1A" text-anchor="start" font-weight="400" >Informes buscados para recuperación</text><text x="94" y="494" font-size="14" fill="#1A1A1A" text-anchor="start" font-weight="400" >(n = 371)</text><line x1="230" y1="420" x2="230" y2="439" stroke="#1A1A1A" stroke-width="1.4"/><path d="M230,448 L225,438 L235,438 Z" fill="#1A1A1A"/><rect x="450" y="450" width="300" height="70" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4" rx="4"/><text x="464" y="474" font-size="14" fill="#1A1A1A" text-anchor="start" font-weight="400" >Informes no recuperados</text><text x="464" y="494" font-size="14" fill="#1A1A1A" text-anchor="start" font-weight="400" >(n = 0)</text><line x1="380" y1="485" x2="439" y2="485" stroke="#1A1A1A" stroke-width="1.4"/><path d="M448,485 L438,480 L438,490 Z" fill="#1A1A1A"/><rect x="80" y="550" width="300" height="70" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4" rx="4"/><text x="94" y="574" font-size="14" fill="#1A1A1A" text-anchor="start" font-weight="400" >Informes evaluados para elegibilidad</text><text x="94" y="594" font-size="14" fill="#1A1A1A" text-anchor="start" font-weight="400" >(n = 371)</text><line x1="230" y1="520" x2="230" y2="539" stroke="#1A1A1A" stroke-width="1.4"/><path d="M230,548 L225,538 L235,538 Z" fill="#1A1A1A"/><rect x="450" y="545" width="430" height="310" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4" rx="4"/><text x="464" y="569" font-size="14" fill="#1A1A1A" text-anchor="start" font-weight="400" >Informes excluidos (n = 319)</text><text x="474" y="589" font-size="14" fill="#1A1A1A" text-anchor="start" font-weight="400" >• Contexto no aplicable (n = 98)</text><text x="474" y="609" font-size="14" fill="#1A1A1A" text-anchor="start" font-weight="400" >• Herramienta desarrollada antes de 2013 (n = 38)</text><text x="474" y="629" font-size="14" fill="#1A1A1A" text-anchor="start" font-weight="400" >• Diseño de estudio no aplicable (n = 36)</text><text x="474" y="649" font-size="14" fill="#1A1A1A" text-anchor="start" font-weight="400" >• Resumen de congreso (n = 36)</text><text x="474" y="669" font-size="14" fill="#1A1A1A" text-anchor="start" font-weight="400" >• Intervención no aplicable (n = 27)</text><text x="474" y="689" font-size="14" fill="#1A1A1A" text-anchor="start" font-weight="400" >• Herramienta en línea inaccesible/rota</text><text x="485" y="709" font-size="14" fill="#1A1A1A" text-anchor="start" font-weight="400" >o sin enlace (n = 24)</text><text x="474" y="729" font-size="14" fill="#1A1A1A" text-anchor="start" font-weight="400" >• Resultados no aplicables (n = 20)</text><text x="474" y="749" font-size="14" fill="#1A1A1A" text-anchor="start" font-weight="400" >• Población de pacientes no aplicable (n = 17)</text><text x="474" y="769" font-size="14" fill="#1A1A1A" text-anchor="start" font-weight="400" >• Protocolo (n = 3)</text><text x="474" y="789" font-size="14" fill="#1A1A1A" text-anchor="start" font-weight="400" >• Vía de administración no aplicable (n = 1)</text><text x="474" y="809" font-size="14" fill="#1A1A1A" text-anchor="start" font-weight="400" >• Relacionado con prevención y tamizaje (n = 19)</text><line x1="380" y1="585" x2="439" y2="585" stroke="#1A1A1A" stroke-width="1.4"/><path d="M448,585 L438,580 L438,590 Z" fill="#1A1A1A"/><rect x="80" y="765" width="300" height="100" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4" rx="4"/><text x="94" y="789" font-size="14" fill="#1A1A1A" text-anchor="start" font-weight="400" >Estudios incluidos en la revisión</text><text x="94" y="809" font-size="14" fill="#1A1A1A" text-anchor="start" font-weight="400" >(n = 46)</text><text x="94" y="829" font-size="14" fill="#1A1A1A" text-anchor="start" font-weight="400" >+ estudios de validación (n = 8)</text><line x1="230" y1="620" x2="230" y2="754" stroke="#1A1A1A" stroke-width="1.4"/><path d="M230,763 L225,753 L235,753 Z" fill="#1A1A1A"/></svg>
