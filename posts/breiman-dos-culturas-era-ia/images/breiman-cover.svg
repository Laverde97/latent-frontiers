<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="breimc-t breimc-d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="breimc-t">Caja de la naturaleza que se bifurca en un modelo de datos y un algoritmo, con una tercera caja punteada para los agentes</title>
  <desc id="breimc-d">Portada conceptual del artículo sobre las dos culturas de Breiman en la era de la IA.</desc>
