    <marker id="breimc-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6B7280"/>
    </marker>
  </defs>
  <defs><linearGradient id="breimc-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1E3D"/><stop offset="1" stop-color="#12305C"/></linearGradient></defs>
  <rect width="1200" height="630" fill="url(#breimc-bg)"/>
  <rect x="475" y="95" width="250" height="120" rx="14" fill="#0F2A52" stroke="#F7F9FC" stroke-width="2"/>
  <text x="600" y="165" font-size="30" fill="#F7F9FC" font-weight="bold" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif">naturaleza</text>
  <rect x="260" y="300" width="250" height="120" rx="14" fill="#1D4E89" stroke="#F7F9FC" stroke-width="2"/>
