  <rect x="690" y="300" width="250" height="120" rx="14" fill="#4C4A7D" stroke="#F7F9FC" stroke-width="2"/>
  <text x="815" y="370" font-size="30" fill="#F7F9FC" font-weight="bold" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif">algoritmo</text>
  <rect x="475" y="470" width="250" height="110" rx="14" fill="none" stroke="#4FA3D1" stroke-width="2.5" stroke-dasharray="8 8"/>
  <text x="600" y="535" font-size="28" fill="#4FA3D1" font-weight="bold" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif">¿agentes?</text>
